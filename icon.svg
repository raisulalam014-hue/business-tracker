<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Card Glow / Inner Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with smooth rounded corners -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4" />

  <!-- Background Decorative Geometric Lines -->
  <path d="M 24 380 Q 256 300 488 380" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <path d="M 24 410 Q 256 330 488 410" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Modern Financial Shield / Ledger Card -->
  <g filter="url(#iconShadow)">
    <!-- Central Glass Card -->
    <rect x="106" y="106" width="300" height="300" rx="48" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

    <!-- Bar 1 (Left) - Initial / Growth Base -->
    <rect x="146" y="270" width="42" height="90" rx="12" fill="#a7f3d0" />

    <!-- Bar 2 (Middle) - Scaling -->
    <rect x="206" y="210" width="42" height="150" rx="12" fill="#34d399" />

    <!-- Bar 3 (Right) - High Profit -->
    <rect x="266" y="150" width="42" height="210" rx="12" fill="#ffffff" />

    <!-- Dynamic Growth Arrow Path -->
    <path d="M 140 280 L 220 200 L 290 140 L 356 140" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead -->
    <polygon points="368,140 342,124 342,156" fill="url(#goldGrad)" />

    <!-- Floating Currency Emblem (Globe / Coin) -->
    <circle cx="340" cy="310" r="42" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
    <!-- Currency / Ledger Symbol ৳ / $ hybrid minimalist line -->
    <text x="340" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#78350f" text-anchor="middle">৳</text>
  </g>

  <!-- Sparkle Accent Top Left -->
  <path d="M 110 80 Q 110 95 95 95 Q 110 95 110 110 Q 110 95 125 95 Q 110 95 110 80 Z" fill="#fde68a" opacity="0.9" />
</svg>

